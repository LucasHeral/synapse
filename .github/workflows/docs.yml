name: Deploy MkDocs Documentation to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies with uv
        run: uv sync

      - name: Generate OpenAPI Spec JSON
        run: |
          uv run python -c "import json, sys; from pathlib import Path; sys.path.insert(0, str(Path.cwd() / 'backend')); from main import app; json.dump(app.openapi(), open('docs/openapi.json', 'w'), indent=2)"

      - name: Deploy MkDocs to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          uv run mkdocs gh-deploy --force
