[project]
name = "synapse"
version = "0.1.0"
description = "SYNAPSE - Hub de Veille Technologique & IA avec Extension Chrome"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "beautifulsoup4>=4.12.0",
    "google-auth>=2.27.0",
    "google-genai>=0.1.0",
    "trafilatura>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "pre-commit>=3.5.0",
    "pytest>=7.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
