[project]
name = "synapse"
version = "0.1.0"
description = "SYNAPSE - Hub de Veille Technologique & IA avec Extension Chrome"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.54.0",
    "requests>=2.31.0",
    "pydantic>=2.13.5",
    "beautifulsoup4>=4.15.0",
    "google-auth>=2.27.0",
    "google-genai>=0.1.0",
    "trafilatura>=1.6.0",
    "ruff>=0.1.0",
    "pre-commit>=4.6.2",
    "pytest>=7.4.0",
    "httpx>=0.28.1",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "pillow>=11.3.0",
    "sqlite-vec>=0.1.9",
    "fastembed>=0.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
